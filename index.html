<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7c20"><title>Earning Money — Tasks & Wallet</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app">

</div><div id="toast" role="status" class="toast"></div><script src="/app.js"></script></body></html>
